output_policy:
  mirror_file: "checkList.md"
  mirror_sync: "state 변경 시 checkList.md 의 해당 체크박스도 함께 갱신한다"
  mirror_status: >
    ⛔ 2026-08-28 확인: checkList.md 가 볼트에 존재하지 않는다.
    배치 전까지 mirror_sync 규칙은 무효다.
  mirror_path: "vault_root/checkList.md"

  agent: "code_root/agent/schedule_agent.py"
  agent_usage: |
    cd ~/Dev/RSCAD/agent
    python test_schedule_agent.py                 # 회귀 테스트
    python schedule_agent.py -f ../schedule.yaml           # 경보 1건
    python schedule_agent.py -f ../schedule.yaml --audit   # evidence 전수 검사
    python schedule_agent.py -f ../schedule.yaml --all

  deprecation_policy: >
    artifact 의 result 값을 교체할 때는 반드시
    (1) 구 값을 superseded_result 필드에 남기고
    (2) 01_개념/폐기값_이력.md 에 상세 블록을 추가하고
        (발견 위치 / 폐기 코드 / 원인 / 검출 방법 / 대체값 / 파급)
    (3) deprecation_log 필드로 해당 항목을 가리킨다.
    값만 갈아치우는 것을 금지한다.

  integrity_check: >
    state 를 verified 로 올리기 전에 evidence 경로의 실재를 확인한다.
    2026-08-28 에 세 건의 기록 무결성 사고가 확인됐다.
      - P3-A1 verified / evidence pf.py → 파일 없음
      - mirror_file: checkList.md → 볼트에 없음
      - Phase_지식_연결맵 "PSO 구현/완료" → 구현된 적 없음
    세 건 모두 하류 작업이 이미 그 위에 쌓여 있었다.

  integrity_check_command: |
    cd ~/Dev/RSCAD                       # schedule.yaml 위치
    # (a) evidence 경로 실재 확인
    grep -o 'code_root/[^"]*' schedule.yaml | sed 's|code_root|~/Dev/RSCAD|' \
      | while read p; do ls $p >/dev/null 2>&1 || echo "MISSING evidence: $p"; done
    # ※ 위 (a) 는 python agent/schedule_agent.py --audit 로 대체 가능
    # (b) 깨진 위키링크 검출 — 볼트에서 실행
    cd ~/Dev/Obsidian/GFM_Research/RSCAD
    grep -rhoP '(?<=\[\[)[^\]|#]+' --include='*.md' . | sort -u \
      | while read n; do
          find . -name "$n.md" -print -quit | grep -q . || echo "BROKEN LINK: [[$n]]"
        done

  forbidden:
    - "진척률 퍼센트 보고"

status_definition:
  states: [not_started, in_progress, draft, verified]
  note: >
    verified 는 evidence 경로의 파일이 실제로 존재할 때만 유효.
    경로 문자열만 적혀 있는 것으로는 부족하다 (R6).

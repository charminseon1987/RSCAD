rules:
  - id: R1
    desc: "마감 역산 — 잔여 월수 < 필요 월수 이면 경보"
  - id: R2
    desc: >
      장비 경보 — (a) P0 의 do_now·blocking 항목이 not_started 이면 즉시 경보,
      (b) P0-A3 미결정 상태로 deadline_month(7월차, 2026-11) 진입 시 최고 등급.
      (a) 를 넣은 이유: 결정 마감이 멀어도 선행 확인은 지금 할 수 있다.
      마감만 보면 3개월간 아무 경보 없이 조용해진다.
    priority: highest
  - id: R3
    desc: "게이트 조건 — 하류 Phase 착수 시 상류 blocking 항목 verified 확인"
  - id: R4
    desc: "증거 없는 완료 — state=verified 인데 evidence=null 이면 draft 로 강등"
  - id: R5
    desc: "정체 감지 — 동일 state 가 4주 이상 유지되면 경보"
  - id: R6
    desc: >
      증거 실재 확인 — state=verified 로 올릴 때 evidence 경로의 파일이
      실제로 존재하는지 확인. 경로만 적혀 있고 파일이 없으면 강등.
    added: 2026-08-28
    cause: "P3-A1 이 pf.py 없이 verified 였고 그 위에 P4 설계가 진행 중이었음"
  - id: R7
    desc: >
      값 교체 금지 — result 를 바꿀 때 구 값을 superseded_result 에 남기고
      deprecation_log 로 폐기값_이력 항목을 가리킨다. 값만 갈아치우면 경보.
    added: 2026-08-28
  - id: R8
    desc: >
      일정 정합성 — phase window 의 시작월보다 current_month 가 이른데
      그 phase 의 artifact 가 verified 이면 경보. month_1_start 오류 또는
      window 재기준화 필요를 의미한다.
    added: 2026-08-28
    cause: "month_1_start 2026-08 이면 1월차인데 P2(2~3월차) 가 이미 verified"


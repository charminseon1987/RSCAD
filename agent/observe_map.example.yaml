# observe_map.yaml — observer.py 설정 (RSCAD/agent/ 에 두는 파일의 예시)
# 신호는 schedule.yaml 의 evidence 에서 자동 유도된다 (derive_from_evidence: true).
# 여기엔 evidence 로 표현 안 되는 것만 손으로 적는다.
meta:
  code_root: ".."            # 이 파일 기준 RSCAD 루트
  stale_days: 14
  derive_from_evidence: true

# evidence 가 있어도 자동 승격하면 안 되는 것 (사람 판단 항목)
manual_only: [P0-A3, P3-A4, P3-A6, P8-A4, P8-A5]

signals:
  # runner.py 실행 흔적 → P2-A5 in_progress 유지 신호 (승격은 draft 까지만)
  - id: RUNNER-P2A5
    pattern: "results/*_p2a5/meta.json"
    reason: "P2-A5 비단조 판별 스윕 실행됨"
    targets: [{artifact: P2-A5, propose: in_progress}]

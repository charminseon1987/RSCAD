# =============================================================================
# schedule.yaml - 연구일정 단일 진실원 (Single Source of Truth)
#
# 위치: GFM_Research/schedule.yaml  (볼트 루트)
# 미러: GFM_Research/checkList.md   (사람이 읽는 체크박스 뷰, 읽기 전용)
#
# 규칙
#  1. 이 파일 외의 어떤 것도 상태 근거로 쓰지 않는다.
#  2. state 는 not_started / in_progress / draft / verified 4단계만 사용.
#  3. state: verified 는 evidence 경로가 있을 때만 유효하다.
#     evidence 가 null 이면 agent 가 draft 로 강등한다. (규칙 R4)
#  4. current_month 는 사용자가 직접 갱신한다. agent 가 추정하지 않는다.
# =============================================================================

meta:
  title: "PSO 기반 2단 PV+ESS GFM 인버터 소신호 모델 최적화 및 SCR-X/R 2D 강건성 경계 정량화"
  owner: "조연호"
  deadline_month: 12          # 월차 기준. 학위논문 제출 마감
  current_month: 4            # <-- 실제 값으로 수정할 것
  buffer_months: 0            # 현재 일정상 여유 없음. Phase 8 종료 = 마감
  updated: null               # agent 가 갱신할 때마다 ISO 날짜 기록

# -----------------------------------------------------------------------------
# 외부 자원 - 일정 전체를 좌우하는 제약
# -----------------------------------------------------------------------------
resources:

    name: "RTDS NovaCor / RSCAD FX 랙"
    required_by_phase: [P6, P7]
    required_from_month: 7
    required_to_month: 11
    total_hours_needed: null    # <-- 파일럿 측정 후 기입 (P7-A0 산출물)
    booked_slots: []            # 예약 확정분. 비어 있으면 R2 최우선 경보
    booking_lead_time_weeks: 8

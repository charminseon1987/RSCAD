rules:
  - {id: R1, desc: "마감 역산 — 잔여 월수 < 필요 월수 이면 경보"}
  - {id: R2, desc: "P5 정체 감지 — 주 검증 축이므로 2주 정체 시 최고 등급",
     priority: highest}
  - {id: R3, desc: "게이트 조건 — 하류 착수 시 상류 blocking 항목 verified 확인"}
  - {id: R4, desc: "증거 없는 완료 — verified 인데 evidence=null 이면 draft 강등"}
  - {id: R5, desc: "정체 감지 — 동일 state 4주 이상 유지 시 경보"}
  - {id: R6, desc: "Tier 복귀 — P0-A1 이 '접근 가능'이 되면 P6 재활성화 여부 질의",
     note: "8월차 이후 확인 시에는 재활성화하지 않는다 — 착수해도 완료 불가"}

status_definition:
  states: [not_started, in_progress, draft, verified, deferred]
  note: "verified 는 evidence 경로가 존재할 때만 유효"

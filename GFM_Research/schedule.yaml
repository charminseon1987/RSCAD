# -----------------------------------------------------------------------------
# 경보 규칙 - agent 는 매 호출 시 이 순서로 평가한다
# -----------------------------------------------------------------------------
alert_rules:

  - id: R2
    priority: 1
    name: "장비 예약 경보"
    condition: >
      resources.rtds_rack.booked_slots 가 비어 있고,
      current_month >= (required_from_month - booking_lead_time_weeks/4)
    action: "랙 예약 요청. 필요 시간은 P7-A0 파일럿 결과로 산정"
    severity: critical

  - id: R1
    priority: 2
    name: "마감 역산 경보"
    condition: >
      (P7.window[0] 까지 남은 주) < (P7.min_duration_weeks + 4)
      또는 (deadline_month - current_month) < 남은 phase 소요 합
    action: "범위 축소 결정. 88포인트를 축소 격자로 낮출지 여기서 판단"
    severity: critical

  - id: R3
    priority: 3
    name: "게이트 미충족 경보"
    condition: >
      current_month >= 8 이고, P7 착수조건(P4-A1 verified AND P6-A4 verified)
      중 하나라도 미충족
    action: "미충족 산출물 하나를 즉시 착수"
    severity: high

  - id: R4
    priority: 4
    name: "증거 없는 완료"
    condition: "state == verified 인데 evidence == null"
    action: "draft 로 강등하고 사용자에게 통보"
    severity: medium

  - id: R5
    priority: 5
    name: "정체 phase"
    condition: "14일간 어떤 artifact 의 state 변화도 없음"
    action: "점검 요청 1건 발송"
    severity: low

# -----------------------------------------------------------------------------
# 출력 정책
# -----------------------------------------------------------------------------
output_policy:
  on_alert: "[등급] Phase / 조건 / 남은 여유 / 지금 해야 할 단일 행동"
  on_clear: "다음 게이트 + 남은 일수. 한 줄."
  max_actions_per_response: 1
  mirror_file: "checkList.md"
  mirror_sync: "state 변경 시 checkList.md 의 해당 체크박스도 함께 갱신한다"
  forbidden:
    - "진척률 퍼센트 보고"
    - "전체 일정 재나열"
    - "격려 문구"
    - "사용자 확인 없는 state 상향"

# ══════════════════════════════════════════════════════════
# schedule.yaml — 연구 일정 단일 진실원
# 갱신: 2026-09-01
#   · P0-A3 Tier 결정 마감 도달 → Tier 2 확정 (소프트웨어 검증)
#   · P5 를 주 검증 축으로 승격, 4~7월차로 재배치
#   · P6/P7 을 조건부(Tier 1/3 복귀 시)로 강등, 소신호 스윕은 P7S 로 분리
#   · P4-A0 안정도 지표 재정의 완료 반영
# ══════════════════════════════════════════════════════════

meta:
  project: GFM-PSO-2D-Robustness
  owner: 조연호
  affiliation: 연세대 전기전자공학부 스마트그리드 연구실
  advisor: 허견

  month_1_start: 2026-05        # ⚠️ 추정값 — 확인 필요
  current_month: 5
  current_date: 2026-09-01
  deadline_month: 12
  buffer_months: 0

  model_version: v3-22state
  code_root: ~/dev/RSCAD
  vault_root: RSCAD

  tier: 2                       # ← 2026-09-01 확정
  tier_decided_on: 2026-09-01
  tier_rationale: >
    5월차 마감까지 RTDS 접근 가능 여부가 확인되지 않아, 사전에 정한 규칙에
    따라 Tier 2(소프트웨어 검증)로 자동 확정. 두 갈래를 병행 준비하다
    양쪽 모두 미완으로 끝나는 것이 버퍼 0 일정에서 가장 큰 위험이므로,
    검증 경로를 하나로 고정한다.
    장비 접근이 이후 확보되면 P6/P7 을 재활성화한다. SIL 이 선행되어 있으면
    CHIL 이행이 빨라지므로 순서상 손해가 아니다.

tier_definition:
  1: {name: "RTDS CHIL",        status: "미확보"}
  2: {name: "소프트웨어 검증 (EMT + SIL)", status: "확정"}
  3: {name: "저비용 CHIL (F28379D ×2, SPI)", status: "조건부 — P5 완료 후 재검토"}

# ──────────────────────────────────────────────────────────
phases:
  - id: P0
    name: "장비 접근 경로 확정"
    window: [4, 5]
    status: closed
    closed_on: 2026-09-01
    outcome: "Tier 2 확정"
    artifacts:
      - id: P0-A1
        name: "랙 접근 자격·창구·마감 확인"
        state: not_started
        note: >
          미해결 상태로 종결. 다만 완전히 폐기하지는 않는다 — 확인되면
          P6/P7 재활성화 판단 근거가 된다. 우선순위는 '낮음'으로 강등.
      - id: P0-A2
        name: "pre-processor 재컴파일 소요시간 문의"
        state: not_started
        note: "Tier 1 복귀 시에만 필요"
      - id: P0-A3
        name: "Tier 결정"
        state: verified
        evidence: "meta.tier = 2"
        result: "Tier 2 — 소프트웨어 검증"
      - id: P0-A4
        name: "저비용 CHIL 대안 조사"
        state: not_started
        window: [7, 8]
        note: >
          P5 완료 후 판단. 여유가 있으면 Tier 3 로 대표점 3~5개만 실증.
          88포인트를 여기서 수행하려 하면 부업이 본업을 잠식한다.

  # ────────────────────────────────────────────────────────
  - id: P2
    name: "22차 야코비안 유도·검증"
    window: [2, 3]
    status: substantially_complete
    artifacts:
      - {id: P2-A1, name: "22차 심볼릭 f(x,u) 및 야코비안", state: verified,
         evidence: "Simulation/model.py"}
      - {id: P2-A2, name: "유한차분 교차검증", state: verified,
         result: "최대 상대오차 1.2e-09"}
      - {id: P2-A3, name: "동작점 SCR 의존성", state: verified,
         result: "δ 22.4° → 62.3°"}
      - {id: P2-A4, name: "양방향 DC-AC 커플링 유도·정량화", state: verified,
         result: "커플링 제거 시 고유값 이동 ≠ 0 (v0: 0.000e+00)"}
      - id: P2-A5
        name: "선형화 유효 범위"
        state: draft
        evidence: "results/*/linearization_validity_*.json"
        result: >
          Pref 기준 13.10%(SCR 1.7) → 11.09%(SCR 1.3), 단조 감소.
          회귀 지수 n=1.99~2.02, R² ≥ 0.9999 → 오차 ∝ 섭동².
        blocking_issue: "허용치 0.5% 의 근거 미확정 → P5-A7 로 이관"
      - {id: P2-A6, name: "TABLE I/Ia — SCR별 A 행렬", state: not_started}
      - {id: P2-A7, name: "22개 상태변수 정의표", state: not_started}
      - {id: P2-A8, name: "SOC 제외·차수 확정 근거 문서화", state: not_started}
      - {id: P2-A9, name: "제어 블록도 4종", state: not_started,
         note: "VSG / Q드룹 / 종속 전압·전류 루프 / DC 이중 루프"}

  # ────────────────────────────────────────────────────────
  - id: P3
    name: "참여계수·지배 모드"
    window: [3, 4]
    status: substantially_complete
    artifacts:
      - {id: P3-A1, name: "참여계수 행렬", state: verified, evidence: "Simulation/pf.py"}
      - id: P3-A2
        name: "지배 모드 식별"
        state: verified
        result: >
          δ 지배 동기화 모드가 임계 모드. Dp/J=40 으로 과감쇠되어 실수극.
          λ: -4.6445(SCR 3.0) → -1.2965(SCR 1.0), 참여도 0.924 → 0.978.
      - {id: P3-A3, name: "모드 물리적 귀속", state: verified}
      - {id: P3-A4, name: "Decision Gate — 22차 유지", state: verified}
      - {id: P3-A5, name: "Prony 예비 적용", state: not_started,
         note: "Tier 2 에서는 EMT 파형 대상으로 수행"}
      - id: P3-A6
        name: "정착시간 요구의 출처 확정"
        state: not_started
        blocking: true
        note: >
          ★ 과제 성격이 바뀜. 당초 'UNIFI 에서 ζ=0.64 조항 찾기' 였으나,
          0.64 는 표준 조항이 아니라 t_s=1s 를 1 Hz 모드로 환산한 값임이
          확인됨 (4/(2π·1) = 0.6366). UNIFI 사양서에는 정성적 'positive
          damping' 요구만 확인된다.
          → 이제 'σ_ref = 4/t_s 의 t_s 가 어느 문서 어느 조항에서 오는가'
          IEEE 2800 / 국내 계통연계 기준 쪽이 유망.

  # ────────────────────────────────────────────────────────
  - id: P4
    name: "PSO 파라미터 최적화"
    window: [5, 7]
    depends_on: [P3]
    gate_for: [P7S]
    artifacts:
      - id: P4-A0
        name: "안정도 지표 재정의"
        state: verified
        evidence: "Simulation/metrics.py"
        result: >
          ζ_min(진동 모드 한정) → σ = -Re(λ) 로 전환.
          t_s ≈ 4/σ 이므로 실수극·진동 모드에 공통 적용된다.
          효과: score 가 1.161 → 0.324 로 3.6배 변화 (구 지표는 0.323→0.324 평탄).
          임계 모드 지배 상태가 전 SCR 에서 delta 로 확정.
      - {id: P4-A1, name: "TABLE II — 14개 파라미터 탐색범위 + 근거",
         state: not_started, blocking: true}
      - id: P4-A2
        name: "다중 운전점 목적함수 정의"
        state: not_started
        note: >
          metrics.objective(A) 를 기반으로 운전점 집합과 가중 규칙을 정한다.
          불안정 시 벌점은 불안정 정도에 비례(계단형 금지 — 기울기 소실).
      - {id: P4-A3, name: "예비 100회 → N_particle / N_iter 결정", state: not_started}
      - {id: P4-A4, name: "가중치 민감도 분석", state: not_started}
      - {id: P4-A5, name: "MC 30회 수렴 재현성", state: not_started,
         note: "난수 시드 고정·기록 필수"}

  # ────────────────────────────────────────────────────────
  - id: P5
    name: "오프라인 EMT · SIL 검증"
    window: [5, 8]
    depends_on: [P2]
    gate_for: [P7S, P8]
    critical: true
    priority: highest
    note: >
      ★ Tier 2 확정으로 주 검증 축이 되었다. 당초 5~6월차 보조 단계에서
      5~8월차 핵심 단계로 승격. 장비와 무관하게 즉시 착수 가능하다.
      RTDS 를 이후 확보하더라도 이 단계가 선행되어야 하므로 손실이 없다.
    artifacts:
      - id: P5-A1
        name: "오프라인 EMT 환경 구축"
        state: not_started
        do_now: true
        note: "PLECS / Simulink / DPsim 중 택1. 스위칭 모델 구성"
      - id: P5-A2
        name: "스위칭 모델 vs 22차 평균 모델 대조"
        state: not_started
        note: >
          평균화 가정의 타당성 확인. xval.py 의 비선형 궤적 적분 로직을
          재사용할 수 있다. 대조 지표는 정격 정규화 오차 + σ 추출값.
      - {id: P5-A3, name: "원형 전류제한기 구현", state: not_started}
      - {id: P5-A4, name: "Anti-windup 설계", state: not_started}
      - {id: P5-A5, name: "X/R = 0.5 EMT — AW 유/무 파형 비교", state: not_started}
      - id: P5-A6
        name: "SIL — DSP C 코드를 EMT 루프에 실제 제어주기로 연동"
        state: not_started
        blocking: true
        note: >
          ★ Tier 2 의 핵심. 고정소수점 연산, ADC 양자화, 1샘플 지연,
          포화·anti-windup 을 재현한다. CHIL 이 추가로 주는 것은 아날로그
          노이즈와 타이밍 지터 정도이므로, 소신호 안정도 경계 검증의
          상당 부분을 대체한다. 이 근거를 논문에 명시할 것.
      - {id: P5-A7, name: "측정 불확도 정량화 (SIL 기반)", state: not_started,
         note: "구 P6-A4 대체. P2-A5 허용치 근거와 P7S 에러바를 함께 공급"}
      - {id: P5-A8, name: "TMS320F28379D 이식 + 제어주기 내 실행시간 프로파일링",
         state: not_started}

  # ────────────────────────────────────────────────────────
  - id: P7S
    name: "2D 경계면 도출 — 소신호 + EMT"
    window: [8, 10]
    depends_on: [P4, P5]
    gate_for: [P8]
    critical: true
    note: >
      ★ 구 P7 을 Tier 2 기준으로 재정의. 소신호 스윕은 노트북에서 수행
      가능하므로 격자 제약이 없다. 88포인트는 하한이며 더 조밀하게 가능.
      대표점만 EMT/SIL 로 교차확인한다.
    artifacts:
      - id: P7S-A1
        name: "SCR–X/R 스윕 자동화"
        state: not_started
        note: >
          runner.py 가 누적·resume 을 지원하므로 기반은 완성. 격자만 확장.
          정착 타임아웃 규칙 필요 — 경계 근처에서 σ→0 이면 t_s 가 발산한다.
      - {id: P7S-A2, name: "SCR*(X/R) 2D 경계면", state: not_started}
      - {id: P7S-A3, name: "대표점 EMT/SIL 교차확인 (5~8점)", state: not_started}
      - {id: P7S-A4, name: "t_s 요구 5세트 민감도", state: not_started,
         note: "구 ζ_thr 민감도. σ_ref = 4/t_s 를 변화시킨다"}
      - {id: P7S-A5, name: "σ_SCR 에러바 (P5-A7 불확도 기반)", state: not_started}
      - {id: P7S-A6, name: "소신호 예측 vs EMT 실측 오차 정량화", state: not_started}

  # ────────────────────────────────────────────────────────
  - id: P6
    name: "RTDS CHIL 구축 (조건부 — 비활성)"
    window: [9, 11]
    status: deferred
    condition: "P0-A1 이 '접근 가능'으로 확인될 경우에만 재활성화"
    note: >
      Tier 2 확정으로 비활성화. 항목은 삭제하지 않고 보존한다 —
      장비가 확보되면 그대로 되살릴 수 있고, 논문 Future Work 서술의
      근거가 되기도 한다.
    artifacts:
      - {id: P6-A1, name: "RSCAD FX 모델 구축", state: deferred}
      - {id: P6-A2, name: "GTAO/GTAI 인터페이스 + 루프 지연 보상", state: deferred}
      - {id: P6-A3, name: "SNR 사전 측정", state: deferred}
      - {id: P6-A5, name: "1포인트당 소요시간 파일럿", state: deferred}
      - {id: P6-A6, name: "스윕 격자 확정", state: deferred}
      # ── 2026-10-01 신설 — A8 하드웨어 검토 게이트 기록 ──
      - id: P6-A7
        name: "A8 하드웨어 적합성 검토 — GO/NO-GO 판정 (hw_review.md)"
        state: deferred
        evidence: null
        requested_on: 2026-10-01
        revisit_on: "2026-11"
        requires: [P0-A1, P6-A2]
        note: >
          2026-10-01 하드웨어 검토 요청이 있었으나 INPUT 부재로 수행 불가.
          a8-gate 의 INPUT 두 건이 모두 존재하지 않는다:
          dsp_fw_spec.md (A6 델피노 산출물), chil_if_spec.md (A7 브릿지 산출물).
          지정 경로 GFM_Research/RSCAD/03_실험/P6-rtds/specs/ 는 생성되어 있으나 비어 있다.
          저장소 전체에 핀맵·ADC 채널·스케일링 상수·타이밍 예산을 담은 설계 문서가
          없어 a8-gate 규칙(추정으로 채우지 않는다)상 판정이 성립하지 않는다.
          RSCAD_RTDS_CHIL_연결구조.md 는 CHIL 개념·실습 안내 문서이므로 검토 대상이 아니다.
          판단: Tier 2 경로(P5 SIL/EMT)를 우선한다. 2026-11 에 R6 에 따라 P0-A1
          재확인 결과와 함께 재활성화 여부를 판단한다.
          R6 단서 — 8월차(2026-12) 이후 확인 시에는 재활성화하지 않는다(착수해도 완료 불가).
          선행 순서: P0-A1 확인 → A6/A7 명세 작성 → A8 판정. 역순 불가.

  # ────────────────────────────────────────────────────────
  - id: P8
    name: "가설 검증 및 집필"
    window: [10, 12]
    depends_on: [P7S]
    artifacts:
      - {id: P8-A1, name: "H1 통계 검정 방법 확정", state: not_started}
      - {id: P8-A2, name: "H2 Wilcoxon — 표본 쌍 정의", state: not_started}
      - {id: P8-A3, name: "H3 — 인접 X/R 구간 ΔSCR* 부호 변화", state: not_started}
      - id: P8-A4
        name: "검증 축 재서술"
        state: not_started
        note: >
          ★ Tier 2 확정에 따른 신규 항목. 차별화 4축 중 검증 축을
          'CHIL' 에서 'SIL 기반 제어기 인더루프 검증' 으로 재서술한다.
          나머지 3축(22차 결합 모델 / 14 파라미터 PSO / 2D 경계)은 유지.
          SIL 이 포착하는 것과 CHIL 만이 포착하는 것을 명확히 구분해 서술.
      - {id: P8-A5, name: "학위논문 본문", state: not_started}
      - {id: P8-A6, name: "IEEE Access 투고 원고", state: not_started,
         note: "TSTE 는 실험 검증 요구가 강해 Tier 2 로는 난도 상승"}

# ──────────────────────────────────────────────────────────
continuous:
  - {id: C1, name: "refs [115] 2D 임피던스 평면 안정도 경계", state: not_started}
  - {id: C2, name: "refs [114] 전차수 VSG 상태공간 모델", state: not_started}
  - {id: C3, name: "refs [94] Lyapunov 기반 파라미터 선정", state: not_started}
  - id: C4
    name: "선행연구 비교표 — 3축 매트릭스"
    state: not_started
    note: "Tier 2 확정 반영: 검증 축을 SIL 기준으로 서술"
  - id: C5
    name: "SIL 이 CHIL 을 어디까지 대체하는가 — 근거 문헌"
    state: not_started
    note: "★ 신규. P8-A4 재서술의 방어 근거. 심사 필수 대응 항목"

# ──────────────────────────────────────────────────────────
gates:
  - {id: G-P4, target: P4, requires: [P3-A6, P4-A0],
     on_fail: "최적화 기준선 부재 → 전량 재실행 위험"}
  - {id: G-P7S, target: P7S, requires: [P4-A1, P5-A6, P5-A7],
     on_fail: "경계면에 에러바를 붙일 수 없음"}
  - {id: G-P8, target: P8, requires: [P7S-A2, P7S-A5],
     on_fail: "가설 검증 불가"}


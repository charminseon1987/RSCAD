# -----------------------------------------------------------------------------
# 경보 규칙 — priority 순 평가, 1건만 보고
# -----------------------------------------------------------------------------
alert_rules:
  - id: R0
    priority: 0
    name: "Tier 미결정"
    condition: "current_month >= tier_deadline_month 이고 tier == null"
    action: "Tier 2 자동 확정 후보 — 사용자 확인 요청 (도구는 값을 쓰지 않는다)"
    severity: critical
  - id: R2
    priority: 1
    name: "장비 예약 경보"
    condition: "tier == 1 이고 booked_slots 비어 있고 current_month >= required_from_month - lead/4"
    action: "랙 예약 요청"
    severity: critical
  - id: R1
    priority: 2
    name: "마감 역산 경보"
    condition: "P7 까지 남은 주 < min_duration_weeks + 4  또는  남은 개월 < 미완 phase 스팬"
    action: "범위 축소 결정 — 88포인트 축소 격자 여부"
    severity: medium                   # pace: accuracy_first — 참고용. 마감을 우선하려면 critical 로
  - id: R3
    priority: 3
    name: "게이트 미충족"
    condition: "current_month >= 8 이고 gates.P7[tier] 미충족"
    action: "미충족 산출물 하나 즉시 착수"
    severity: high
  - id: R4
    priority: 4
    name: "증거 없는 완료"
    condition: "state == verified 이고 evidence == null"
    action: "draft 강등 + 통보"
    severity: medium
  - id: R5
    priority: 5
    name: "정체"
    condition: "14일간 state 변화 없음"
    action: "점검 요청 1건"
    severity: low

output_policy:
  on_alert: "[등급] Phase / 조건 / 남은 여유 / 지금 해야 할 단일 행동"
  on_clear: "다음 게이트 + 남은 일수. 한 줄."
  max_actions_per_response: 1
  mirror_file: "checkList.md"
  forbidden:
    - "진척률 퍼센트 보고"
    - "전체 일정 재나열"
    - "격려 문구"
    - "사용자 확인 없는 state 상향"

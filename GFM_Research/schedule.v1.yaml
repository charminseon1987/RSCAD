# =============================================================================
# schedule.yaml v1 — 연구일정 단일 진실원 (Single Source of Truth)
#
# 위치: GFM_Research/schedule.yaml   미러: GFM_Research/checkList.md (읽기 전용)
# 생성: 2026-09-09, checkList_v0.1(2026-08-26) 기준으로 재작성. 규칙은 skills/schedule_sync.md
#
# 규칙
#  1. 이 파일 외의 어떤 것도 상태 근거로 쓰지 않는다.
#  2. state 는 not_started / in_progress / draft / verified 4단계만.
#  3. verified 는 evidence 경로가 있을 때만 유효. evidence null → agent 가 draft 로 강등 (R4).
#  4. current_month 는 사용자가 직접 갱신한다. agent 는 month_1_start 로 계산한 값과 다르면 경고만 한다.
#  5. 체크리스트에서 ✅였으나 evidence 경로가 없는 항목은 draft 로 두었다 — 경로 기입 후 verified 로 올릴 것. (# 확인 필요)
# =============================================================================

meta:
  title: "PSO 기반 2단 PV+ESS GFM 인버터 소신호 모델 최적화 및 SCR-X/R 2D 강건성 경계 정량화"
  owner: "조연호"
  model_version: v3-22state          # runner.py MODEL_VERSION 과 동기. v0(21차, sym.py) 폐기 — 2026-08
  code_root: "."                     # RSCAD 저장소 루트 (observer.py --root)
  vault_root: "GFM_Research"         # Obsidian Vault (observer.py 가 vault_root/ 접두어 해석)
  pace: accuracy_first               # 마감보다 정확성 우선 — R1 은 참고 경보로 강등
  month_1_start: "2026-05"           # 확정 (2026-09-09)
  current_month: 5                   # 2026-09 = 5월차. 사용자가 갱신
  deadline_month: 12
  buffer_months: 0
  tier: 2                            # 확정 (2026-09-09): 소프트웨어 검증 (EMT + SIL). CHIL 축은 C4 에서 재서술
  tier_deadline_month: 5
  updated: "2026-09-09"

